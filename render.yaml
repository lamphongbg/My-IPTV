databases:
  - name: my-iptv-db
    databaseName: iptv
    user: iptv_user
    plan: free
    region: singapore

services:
  - type: web
    name: my-iptv
    env: node
    plan: free
    region: singapore
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: my-iptv-db
          property: connectionString
